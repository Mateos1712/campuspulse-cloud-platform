[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campuspulse"
version = "0.1.0"
description = "Observable higher-education SaaS demo for a Cloud Engineer portfolio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2.0",
  "httpx>=0.27,<1.0",
  "pip-audit>=2.7,<3.0",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
